# ---------------------------------------------------------------------------
# 图匠工坊 Tujang Studio
#
# 标准用法（评审环境）：
#   docker compose up --build
#   → Web http://localhost:3000 · API http://localhost:8080 · MySQL localhost:3306
#
# 当前阶段（P0）：api / web 尚在 profiles: ["app"] 下，默认只起 mysql。
#   docker compose up -d mysql
# P7 完成后会移除这两个 profile，使 up --build 默认启动三个服务。
#
# 本机 3306 / 8080 已被占用时，用不提交的 .env 覆盖端口即可（见 .env.example）。
# ---------------------------------------------------------------------------

services:
  mysql:
    image: mysql:8.0
    container_name: tujang-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tujang_root_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tujang}
      MYSQL_USER: ${MYSQL_USER:-tujang}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tujang_pw}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空时执行，顺序按文件名
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tujang-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-tujang}
      DB_USER: ${MYSQL_USER:-tujang}
      DB_PASSWORD: ${MYSQL_PASSWORD:-tujang_pw}
      APP_STORAGE_DATA_DIR: /app/data
      APP_STORAGE_SEED_DIR: /app/seed
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./seed:/app/seed:ro
      - app-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tujang-web
    environment:
      BACKEND_URL: http://api:8080
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql-data:
  app-data:
